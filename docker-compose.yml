name: poc-observabilidad

services:
  api:
    build: ./api
    container_name: demo-api
    ports:
      - "3000:3000"
    environment:
      SERVICE_NAME: demo-api
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      # Solo para el laboratorio: acceso anónimo de lectura y admin/admin.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/api-red.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  # Generador de carga. No arranca con `docker compose up`; se ejecuta bajo demanda:
  #   docker compose run --rm k6 run /scripts/normal.js
  k6:
    image: grafana/k6:1.3.0
    profiles: ["load"]
    environment:
      BASE_URL: http://api:3000
    volumes:
      - ./k6:/scripts:ro
    depends_on:
      - api

volumes:
  prometheus-data:
  grafana-data:
