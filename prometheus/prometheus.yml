global:
  # Intervalo corto para que la demo reaccione rápido. En producción lo habitual
  # es 15-60 s: menor intervalo = más resolución, pero más carga y almacenamiento.
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    environment: lab

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: demo-api
    metrics_path: /metrics
    static_configs:
      - targets: ['api:3000']
        labels:
          team: cloud-lab

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
